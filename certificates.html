<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鄭柏瑞 ｜ 2026 第 35 屆時報金犢獎 優秀獎獎狀</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --ink:#25313b; --sub:#68757f; --line:#e2e7ec; --accent:#2f4858; --gold:#b5842a; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12171c; --card:#1b2229; --ink:#e7ecf0; --sub:#9aa7b2; --line:#2b343d; --accent:#8fb0c4; --gold:#d8b25e; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap{ max-width:1180px; margin:0 auto; padding:36px 20px 60px; }
  header{ border-bottom:2px solid var(--accent); padding-bottom:16px; margin-bottom:26px; }
  h1{ font-size:24px; letter-spacing:1px; color:var(--accent); }
  .meta{ color:var(--sub); font-size:14px; margin-top:6px; }
  .meta b{ color:var(--gold); }
  .back{ display:inline-block; margin-top:8px; color:var(--accent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); transition:transform .15s, box-shadow .15s; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,.12); }
  .card img{ width:100%; display:block; aspect-ratio:620/877; object-fit:contain; background:#fff; cursor:zoom-in; }
  .card .body{ padding:12px 15px 15px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--gold); border-radius:4px; padding:2px 9px; letter-spacing:.5px; }
  .title{ font-weight:700; font-size:15px; margin:8px 0 3px; }
  .sub{ color:var(--sub); font-size:12.5px; }
  footer{ margin-top:34px; color:var(--sub); font-size:12.5px; text-align:center; }
  #lb{ position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; z-index:9; }
  #lb.on{ display:flex; }
  #lb img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>鄭柏瑞 ｜ 2026 第 35 屆時報金犢獎 優秀獎獎狀</h1>
    <div class="meta">共 6 件作品獲得 <b>優秀獎 ×6</b> ｜ 點擊任一獎狀可放大檢視</div>
    <a class="back" href="./">返回 6 件得獎作品</a>
  </header>
  <div class="grid" id="grid"></div>
  <footer>指導老師：吳思璿　·　南臺科技大學</footer>
</div>
<div id="lb"><img alt=""></div>
<script>
  const certificates = [
    {img:"certificates/TH14C-2026-0025_1.jpg?v=20260721c", title:"《旺旺宇宙飛行日誌》毛絨盲盒系列", id:"TH14C-2026-0025"},
    {img:"certificates/TH14A-2026-0026_1.jpg?v=20260721c", title:"《旺旺經典：紅罐飛行日記》潮流盲盒", id:"TH14A-2026-0026"},
    {img:"certificates/TH16A-2026-0013_1.jpg?v=20260721c", title:"FixxBody《Everybody Fixbody》", id:"TH16A-2026-0013"},
    {img:"certificates/TH16C-2026-0014_1.jpg?v=20260721c", title:"辣力覺醒，街頭共生（Mr.HOT）", id:"TH16C-2026-0014"},
    {img:"certificates/TH16D-2026-0015_1.jpg?v=20260721c", title:"移步換景（社交藝術場）", id:"TH16D-2026-0015"},
    {img:"certificates/TH11A-2026-0026_1.jpg?v=20260721c", title:"《和美保定・城禮成章》", id:"TH11A-2026-0026"},
  ];
  const grid = document.getElementById("grid");
  certificates.forEach(certificate=>{
    const card = document.createElement("div"); card.className="card";
    card.innerHTML = `<img src="${certificate.img}" alt="${certificate.title} 優秀獎獎狀" loading="lazy">
      <div class="body"><span class="badge">優秀獎</span>
      <div class="title">${certificate.title}</div><div class="sub">證書編號：${certificate.id}</div></div>`;
    card.querySelector("img").addEventListener("click", ()=>{
      const lb=document.getElementById("lb"); lb.querySelector("img").src=certificate.img; lb.classList.add("on");
    });
    grid.appendChild(card);
  });
  document.getElementById("lb").addEventListener("click", event=> event.currentTarget.classList.remove("on"));
</script>
</body>
</html>
